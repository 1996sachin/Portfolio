<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <!-- Clean White Background -->
  <rect width="1200" height="700" fill="#FFFFFF"/>

  <g transform="translate(600, 220)">
    <!-- Outer Frame: Sharp Futuristic Hexagon -->
    <polygon points="0,-160 140,-75 140,85 0,170 -140,85 -140,-75" fill="none" stroke="#0F172A" stroke-width="14" stroke-linejoin="round"/>

    <!-- Circuit Nodes at Hexagon Vertices -->
    <circle cx="0" cy="-160" r="9" fill="#06B6D4"/>
    <circle cx="140" cy="-75" r="9" fill="#2563EB"/>
    <circle cx="140" cy="85" r="9" fill="#06B6D4"/>
    <circle cx="0" cy="170" r="9" fill="#2563EB"/>
    <circle cx="-140" cy="85" r="9" fill="#06B6D4"/>
    <circle cx="-140" cy="-75" r="9" fill="#2563EB"/>

    <!-- Top-Right: Cloud -->
    <g transform="translate(60, -145) scale(0.7)">
      <path d="M 12 35 A 18 18 0 0 1 35 15 A 25 25 0 0 1 80 22 A 18 18 0 0 1 85 50 L 12 50 Z" fill="#06B6D4"/>
    </g>

    <!-- Mid-Left: Kubernetes Wheel (Helm) -->
    <g transform="translate(-195, -20) scale(0.8)">
      <circle cx="24" cy="24" r="18" fill="none" stroke="#2563EB" stroke-width="5"/>
      <circle cx="24" cy="24" r="6" fill="#0F172A"/>
      <line x1="24" y1="2" x2="24" y2="46" stroke="#2563EB" stroke-width="4"/>
      <line x1="2" y1="24" x2="46" y2="24" stroke="#2563EB" stroke-width="4"/>
      <line x1="8" y1="8" x2="40" y2="40" stroke="#2563EB" stroke-width="4"/>
      <line x1="8" y1="40" x2="40" y2="8" stroke="#2563EB" stroke-width="4"/>
    </g>

    <!-- Mid-Right: Gear -->
    <g transform="translate(160, -20) scale(0.8)">
      <circle cx="20" cy="20" r="15" fill="none" stroke="#2563EB" stroke-width="5" stroke-dasharray="6,4"/>
      <circle cx="20" cy="20" r="6" fill="#0F172A"/>
    </g>

    <!-- Bottom-Left: Docker Container Block -->
    <g transform="translate(-160, 75) scale(0.75)">
      <rect x="0" y="10" width="9" height="7" rx="1" fill="#06B6D4"/>
      <rect x="11" y="10" width="9" height="7" rx="1" fill="#06B6D4"/>
      <rect x="22" y="10" width="9" height="7" rx="1" fill="#06B6D4"/>
      <rect x="11" y="1" width="9" height="7" rx="1" fill="#06B6D4"/>
      <rect x="22" y="1" width="9" height="7" rx="1" fill="#06B6D4"/>
      <path d="M -4 20 C 15 20 30 20 38 15 C 40 22 34 26 25 26 L -4 26 Z" fill="#2563EB"/>
    </g>

    <!-- Bottom-Right: Terminal (>_) -->
    <g transform="translate(125, 75) scale(0.85)">
      <rect x="0" y="0" width="44" height="32" rx="6" fill="#0F172A"/>
      <path d="M 10 9 L 19 16 L 10 23" fill="none" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="22" y1="23" x2="33" y2="23" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Central "S" Infinity Loop & CI/CD Flow -->
    <path d="M 60 -55 L -10 -55 C -40 -55 -60 -35 -60 -10 C -60 20 -30 32 0 32 L 20 32 C 50 32 70 48 70 72 C 70 98 46 115 0 115 L -60 115"
          fill="none" stroke="#2563EB" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 60 -55 L -10 -55 C -40 -55 -60 -35 -60 -10 C -60 20 -30 32 0 32 L 20 32 C 50 32 70 48 70 72 C 70 98 46 115 0 115 L -60 115"
          fill="none" stroke="#06B6D4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 50 -55 H -10 C -35 -55 -48 -40 -48 -18 C -48 5 -30 20 0 20 C 30 20 54 32 54 58 C 54 82 35 98 0 98 H -50"
          fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <!-- Brand Name -->
  <text x="600" y="460" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Inter', sans-serif" font-size="52" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="4">SACHIN DEVOPS</text>
  
  <!-- Sub-heading -->
  <text x="600" y="520" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Inter', sans-serif" font-size="28" font-weight="700" fill="#2563EB" text-anchor="middle" letter-spacing="12">PORTFOLIO</text>

  <!-- Divider Line -->
  <line x1="450" y1="550" x2="750" y2="550" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" />

  <!-- Tagline -->
  <text x="600" y="590" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="600" fill="#0F172A" text-anchor="middle" letter-spacing="6">AUTOMATE • BUILD • DEPLOY • SECURE</text>
</svg>
