<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Outer Frame: Sharp Futuristic Hexagon -->
  <polygon points="256,36 430,136 430,336 256,436 82,336 82,136" fill="none" stroke="#0F172A" stroke-width="20" stroke-linejoin="round"/>

  <!-- Circuit Nodes at Hexagon Vertices -->
  <circle cx="256" cy="36" r="12" fill="#06B6D4"/>
  <circle cx="430" cy="136" r="12" fill="#2563EB"/>
  <circle cx="430" cy="336" r="12" fill="#06B6D4"/>
  <circle cx="256" cy="436" r="12" fill="#2563EB"/>
  <circle cx="82" cy="336" r="12" fill="#06B6D4"/>
  <circle cx="82" cy="136" r="12" fill="#2563EB"/>

  <!-- DevOps Component Icons around frame -->
  <!-- Top-Right: Cloud -->
  <g transform="translate(325, 80) scale(0.9)">
    <path d="M 12 35 A 18 18 0 0 1 35 15 A 25 25 0 0 1 80 22 A 18 18 0 0 1 85 50 L 12 50 Z" fill="#06B6D4"/>
  </g>

  <!-- Mid-Left: Kubernetes Wheel (Helm) -->
  <g transform="translate(100, 195) scale(0.95)">
    <circle cx="24" cy="24" r="18" fill="none" stroke="#2563EB" stroke-width="5"/>
    <circle cx="24" cy="24" r="6" fill="#0F172A"/>
    <line x1="24" y1="2" x2="24" y2="46" stroke="#2563EB" stroke-width="4"/>
    <line x1="2" y1="24" x2="46" y2="24" stroke="#2563EB" stroke-width="4"/>
    <line x1="8" y1="8" x2="40" y2="40" stroke="#2563EB" stroke-width="4"/>
    <line x1="8" y1="40" x2="40" y2="8" stroke="#2563EB" stroke-width="4"/>
  </g>

  <!-- Mid-Right: Gear -->
  <g transform="translate(365, 195) scale(0.95)">
    <circle cx="20" cy="20" r="15" fill="none" stroke="#2563EB" stroke-width="5" stroke-dasharray="6,4"/>
    <circle cx="20" cy="20" r="6" fill="#0F172A"/>
  </g>

  <!-- Bottom-Left: Docker Container Block / Whale motif -->
  <g transform="translate(115, 310) scale(0.9)">
    <rect x="0" y="10" width="9" height="7" rx="1" fill="#06B6D4"/>
    <rect x="11" y="10" width="9" height="7" rx="1" fill="#06B6D4"/>
    <rect x="22" y="10" width="9" height="7" rx="1" fill="#06B6D4"/>
    <rect x="11" y="1" width="9" height="7" rx="1" fill="#06B6D4"/>
    <rect x="22" y="1" width="9" height="7" rx="1" fill="#06B6D4"/>
    <path d="M -4 20 C 15 20 30 20 38 15 C 40 22 34 26 25 26 L -4 26 Z" fill="#2563EB"/>
  </g>

  <!-- Bottom-Right: Terminal (>_) -->
  <g transform="translate(350, 310)">
    <rect x="0" y="0" width="44" height="32" rx="6" fill="#0F172A"/>
    <path d="M 10 9 L 19 16 L 10 23" fill="none" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="22" y1="23" x2="33" y2="23" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Central "S" Infinity Loop & CI/CD Flow -->
  <!-- Upper Teal/Cyan curve -->
  <path d="M 330 180 L 245 180 C 205 180 180 205 180 236 C 180 270 210 286 256 286 L 275 286 C 315 286 340 306 340 336 C 340 370 310 392 256 392 L 180 392"
        fill="none" stroke="#2563EB" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 330 180 L 245 180 C 205 180 180 205 180 236 C 180 270 210 286 256 286 L 275 286 C 315 286 340 306 340 336 C 340 370 310 392 256 392 L 180 392"
        fill="none" stroke="#06B6D4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- High contrast Navy spine -->
  <path d="M 320 180 H 245 C 215 180 196 198 196 226 C 196 254 220 270 256 270 C 292 270 324 286 324 316 C 324 346 300 366 256 366 H 190"
        fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
