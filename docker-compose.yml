version: "3.8"

services:
  app:
    build: .
    container_name: portfolio_app
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    container_name: portfolio_mongo
    restart: always
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
